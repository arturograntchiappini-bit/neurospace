[package]
name = "sb-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "sb_app"
path = "src/lib.rs"

[[bin]]
name = "secondbrain"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "links", "accesskit"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
clap.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
raw-window-handle = "0.6.2"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "wayland"] }
sb-core = { path = "../sb-core" }
sb-sync = { path = "../sb-sync" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.1"

[dev-dependencies]
egui_kittest = "0.37"
tempfile.workspace = true
